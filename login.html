<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronForge | Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 5rem auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .login-container h2 { margin-bottom: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; }
        .form-group input { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 4px; }
        .login-btn { width: 100%; background: #ff4500; color: white; border: none; padding: 1rem; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .login-btn:hover { background: #e63e00; }
        .signup-link { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
    <svg width="46" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
        <path d="M 4 18 L 10 12 L 18 12 L 18 38 L 10 38 L 4 32 Z" fill="#ffffff" />
        <path d="M 18 21 L 32 21 L 32 29 L 18 29 Z" fill="#ff4500" />
        <path d="M 32 12 L 40 12 L 46 18 L 46 32 L 40 38 L 32 38 Z" fill="#ffffff" />
    </svg>
    <div style="font-family: 'Poppins', sans-serif; font-size: 28px; font-weight: 800; font-style: italic; color: #ffffff; letter-spacing: 1px;">
        IRON<span style="color: #ff4500;">FORGE</span>
    </div>
</a>
        <ul class="nav-links">
            <li><a href="MainPage.html">Home</a></li>
            <li><a href="equipment.html">Equipment</a></li>
        </ul>
    </nav>

    <div class="login-container">
        <h2>Member Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="login-btn">Log In</button>
        </form>
        <p class="signup-link">Don't have an account? <a href="#">Sign up here</a></p>
    </div>
</body>
</html>
