<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronForge | Supplements</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Cart Sidebar -->
    <div id="cartSidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Your Cart</h2>
            <button onclick="toggleCart()" class="close-btn">&times;</button>
        </div>
        <div id="cartItemsContainer"></div>
        <div class="sidebar-footer">
            <div class="total-row"><span>Total:</span><span id="cartTotalDisplay">DT0.00</span></div>
            <!-- Ensure the button has the checkout logic -->
            <button class="checkout-btn" onclick="window.location.href='checkout.html'">Checkout</button>
        </div>
    </div>
    <div id="cartOverlay" onclick="toggleCart()"></div>

    <nav class="navbar">
        <div class="logo">IronForge</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="equipment.html">Equipment</a></li>
            <li><a href="apparel.html">Apparel</a></li>
            <li><a href="supplements.html" style="color: #ff4500;">Supplements</a></li>
        </ul>
        <div class="nav-actions">
            <a href="#">Log In</a>
            <a href="javascript:void(0)" onclick="toggleCart()">Cart (0)</a>
        </div>
    </nav>

    <header class="hero">
        <h1>Fuel Your Growth</h1>
        <p>Pure ingredients. Maximum results.</p>
    </header>

    <section class="products">
        <!-- Leave this empty! script.js will fill it from Firebase -->
        <div class="product-grid"></div>
    </section>

    <footer><p>&copy; 2026 IronForge Gym Store.</p></footer>

    <!-- The Trigger Script -->
    <script type="module">
        import { loadProducts } from './script.js';
        // This pulls specifically from the "Supplements" category in your DB
        loadProducts("Supplements");
    </script>
</body>
</html>
